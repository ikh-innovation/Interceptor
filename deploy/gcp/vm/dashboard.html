<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Drones Online</title>
<style>
  :root {
    color-scheme: dark light;
    --bg: #0b0f14;
    --panel: #121820;
    --panel-2: #1a222d;
    --text: #e7eef7;
    --muted: #8ea0b5;
    --accent: #4fc3f7;
    --ok: #4ade80;
    --warn: #f59e0b;
    --err: #f87171;
    --border: #233041;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --panel-2: #f0f3f8;
      --text: #0f1b2b;
      --muted: #5a6b80;
      --accent: #0369a1;
      --border: #d6deea;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
  }
  header {
    padding: 20px 16px 8px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    max-width: 920px;
    margin: 0 auto;
  }
  h1 {
    font-size: 20px;
    margin: 0;
    letter-spacing: 0.3px;
  }
  .sub { color: var(--muted); font-size: 13px; }
  main {
    max-width: 920px;
    margin: 0 auto;
    padding: 12px 16px 48px;
  }
  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin: 8px 0 16px;
    color: var(--muted);
    font-size: 13px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 8px var(--ok);
    display: inline-block;
  }
  .dot.err { background: var(--err); box-shadow: 0 0 8px var(--err); }
  .grid {
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card h2 {
    font-size: 16px;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    word-break: break-all;
  }
  .meta { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .status-ok { color: var(--ok); }
  .status-err { color: var(--err); }
  .status-wait { color: var(--muted); }
  .row { display: flex; gap: 8px; }
  .btn {
    flex: 1;
    text-align: center;
    background: var(--accent);
    color: #04121c;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 10px 12px;
    text-decoration: none;
    font-size: 14px;
    cursor: pointer;
  }
  .btn.secondary {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    font-weight: 500;
  }
  .empty {
    padding: 48px 20px;
    text-align: center;
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: 12px;
    background: var(--panel);
  }
  .empty code {
    display: inline-block;
    background: var(--panel-2);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    padding: 24px 16px 40px;
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Drones Online</h1>
    <div class="sub">Interceptor fleet · pick a drone to open its cockpit</div>
  </div>
  <div class="sub"><span id="count">—</span> online</div>
</header>

<main>
  <div class="toolbar">
    <span class="dot" id="pulse"></span>
    <span id="status">Fetching…</span>
    <span style="margin-left:auto">Auto-refresh 5s</span>
  </div>
  <div id="list" class="grid"></div>
</main>

<footer>Interceptor relay · <span id="host"></span></footer>

<script>
  const listEl = document.getElementById("list");
  const countEl = document.getElementById("count");
  const statusEl = document.getElementById("status");
  const pulseEl = document.getElementById("pulse");
  document.getElementById("host").textContent = location.host;

  const DOMAIN = location.host;

  async function fetchTunnels() {
    try {
      const r = await fetch("/api/proxy/http", { credentials: "same-origin" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();
      pulseEl.classList.remove("err");
      statusEl.textContent = "Connected";
      render(data.proxies || []);
    } catch (e) {
      pulseEl.classList.add("err");
      statusEl.textContent = "Relay unreachable: " + e.message;
    }
  }

  function render(proxies) {
    const online = proxies.filter(p => p.status === "online");
    countEl.textContent = online.length;
    if (online.length === 0) {
      listEl.innerHTML = `
        <div class="empty">
          <div style="font-size:15px;color:var(--text);margin-bottom:8px">No drones online yet.</div>
          On each Jetson, run:<br/>
          <code>sudo deploy/gcp/jetson/install-frpc.sh --name wasp-01 --server ${DOMAIN} --token &lt;token&gt;</code>
        </div>`;
      return;
    }
    listEl.innerHTML = "";
    for (const p of online) {
      const sub = p.conf && p.conf.subdomain ? p.conf.subdomain : p.name;
      const host = `${sub}.${DOMAIN}`;
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <h2><span class="dot"></span>${p.name}</h2>
        <div class="meta" id="meta-${sub}">
          Camera: <span class="status-wait">checking…</span><br/>
          Controller: <span class="status-wait">checking…</span>
        </div>
        <div class="row">
          <a class="btn" href="https://${host}/" target="_blank" rel="noopener">Open cockpit</a>
          <a class="btn secondary" href="https://${host}/state" target="_blank" rel="noopener">Logs</a>
        </div>`;
      fetchDroneStatus(host, sub);
      listEl.appendChild(card);
    }
  }

  async function fetchDroneStatus(host, sub) {
    const el = document.getElementById("meta-" + sub);
    if (!el) return;
    try {
      const r = await fetch(`https://${host}/state`, { signal: AbortSignal.timeout(4000) });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const s = await r.json();
      const camOk = s.cam_frame && !s.cam_error;
      const ctrlOk = s.linked;
      el.innerHTML =
        `Camera: <span class="${camOk ? "status-ok" : "status-err"}">${camOk ? "connected" : (s.cam_error || "error")}</span><br/>` +
        `Controller: <span class="${ctrlOk ? "status-ok" : "status-err"}">${ctrlOk ? "connected" : "error"}</span>`;
    } catch {
      el.innerHTML =
        `Camera: <span class="status-err">unreachable</span><br/>` +
        `Controller: <span class="status-err">unreachable</span>`;
    }
  }

  fetchTunnels();
  setInterval(fetchTunnels, 5000);
</script>
</body>
</html>
